name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Resolves the site's base path (repo name, or empty for user sites and
      # custom domains) and enables Pages if the token is allowed to.
      # If it is not, run scripts/enable-pages.sh once (see README).
      - id: pages
        uses: actions/configure-pages@v5
        with:
          enablement: ${{ github.event_name != 'pull_request' }}

      - run: npm ci

      # Quality gates: a failing check blocks the deploy.
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm run test

      - run: npm run build
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}/

      # SPA fallback: Pages serves 404.html for unknown paths.
      - run: cp dist/index.html dist/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
